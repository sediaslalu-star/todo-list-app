<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card">
        <header class="header">
          <div>
            <p class="eyebrow">Daily Planner</p>
            <h1>Todo List</h1>
          </div>
          <span id="task-count" class="count-badge">0 tasks</span>
        </header>

        <form id="todo-form" class="todo-form">
          <input
            id="todo-input"
            type="text"
            placeholder="What needs to be done?"
            aria-label="New task"
            maxlength="120"
            autocomplete="off"
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar" aria-label="Task filters">
          <button class="filter-btn active" type="button" data-filter="all">All</button>
          <button class="filter-btn" type="button" data-filter="active">Active</button>
          <button class="filter-btn" type="button" data-filter="completed">Completed</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <div class="footer">
          <p id="empty-state" class="empty-state hidden">No tasks yet. Add your first one above.</p>
          <button id="clear-completed" class="clear-btn" type="button">Clear completed</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
